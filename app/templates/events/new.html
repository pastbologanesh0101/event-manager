{% extends "base.html" %}
{% block title %}New Event - Event Manager{% endblock %}
{% block content %}
    <h1>Create a New Event</h1>

    <form method="post" class="form">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ form.get('title', '') }}" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4">{{ form.get('description', '') }}</textarea>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{ form.get('date', '') }}" required>

        <label for="location">Location</label>
        <input type="text" id="location" name="location" value="{{ form.get('location', '') }}">

        <label for="capacity">Capacity</label>
        <input type="number" id="capacity" name="capacity" min="1" value="{{ form.get('capacity', '') }}" required>

        <button type="submit">Create Event</button>
    </form>
{% endblock %}
